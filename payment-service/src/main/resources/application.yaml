spring:
  application:
    name: payment-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/e_commerce_db?characterEncoding=latin1&useConfigs=maxPerformance&allowPublicKeyRetrieval=true&useSSL=false&sessionVariables=sql_mode=''
    username: root
    password: Subham@1234
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
      spring.json.trusted.packages: "*"
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: payment-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      max-poll-records: 100
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: "orderEvent:com.smartmart.paymentservice.dto.OrderEventDto"
  web:
    error:
      include-message: always
      include-binding-errors: always

server:
  port: 8122
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.smartmart.paymentservice: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/payment-service.log
    max-size: 10MB
    max-history: 10

payment:
  gateway:
    stripe:
      enabled: true
      api-key: sk_test_your_stripe_key
      publishable-key: pk_test_your_publishable_key
    razorpay:
      enabled: true
      key-id: your_razorpay_key_id
      key-secret: your_razorpay_key_secret
    paypal:
      enabled: false
      client-id: your_paypal_client_id
      client-secret: your_paypal_client_secret
  max-retries: 3
  retry-delay-ms: 5000
  timeout-seconds: 30

