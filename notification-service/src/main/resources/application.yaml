spring:
  application:
    name: notification-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/e_commerce_db?characterEncoding=latin1&useConfigs=maxPerformance&allowPublicKeyRetrieval=true&useSSL=false&sessionVariables=sql_mode=''
    username: root
    password: Subham@1234
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: notification-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
  web:
    error:
      include-message: always
      include-binding-errors: always

# Server configuration
server:
  port: 8124
  servlet:
    context-path: /

# Logging configuration
logging:
  level:
    root: INFO
    com.smartmart.notification: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/notification-service.log
    max-size: 10MB
    max-history: 10

# Payment Service API reference
payment-service:
  url: http://localhost:8122
  endpoints:
    process-payment: /api/payments/process
    get-payment: /api/payments/{id}
    update-status: /api/payments/{id}/status

# Notification configuration
notification:
  email:
    enabled: true
    from: noreply@smartmart.com
    smtp-host: smtp.gmail.com
    smtp-port: 587
    username: your-email@gmail.com
    password: your-app-password
  sms:
    enabled: true
    provider: twilio
    account-sid: your-account-sid
    auth-token: your-auth-token
    from-number: +1234567890
  max-retries: 3
  retry-delay-ms: 5000
