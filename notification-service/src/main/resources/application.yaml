spring:
  application:
    name: notification-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/e_commerce_db?characterEncoding=latin1&useConfigs=maxPerformance&allowPublicKeyRetrieval=true&useSSL=false&sessionVariables=sql_mode=''
    username: root
    password: Subham@1234
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  web:
    error:
      include-message: always
      include-binding-errors: always

# Server configuration
server:
  port: 8124

# Logging configuration
logging:
  level:
    root: INFO
    com.smartmart.notification: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/notification-service.log
    max-size: 10MB
    max-history: 10

# Payment Service API reference
payment-service:
  url: http://localhost:8122
  endpoints:
    process-payment: /api/payments/process
    get-payment: /api/payments/{id}
    update-status: /api/payments/{id}/status

# Eureka Client configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
